org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Your login server (the auth-server). With an address here the app shows a simple
# username + password sign-in instead of the playlist setup. Leave empty for the original app.
channelbox.authUrl=https://auth.yourdomain.com
